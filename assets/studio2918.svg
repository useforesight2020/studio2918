<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Studio 2918 lighthouse">
  <!-- Studio 2918 primary mark. Navy #1d3557 + brass #c9a227. 1.6u stroke, 1.2u negative-space gaps. -->
  <g fill="#1d3557">
    <!-- rod, vent ball, ogee roof, eave -->
    <rect x="59.3" y="3" width="1.4" height="5"/>
    <circle cx="60" cy="9.4" r="2"/>
    <path d="M60 11.6 C61.6 15.4 64.6 19.2 68.4 21.6 L51.6 21.6 C55.4 19.2 58.4 15.4 60 11.6 Z"/>
    <rect x="50.6" y="21.6" width="18.8" height="1.8" rx=".4"/>
    <!-- lantern frame (right third stays in shadow) -->
    <rect x="53.6" y="24.6" width="12.8" height="8.4"/>
    <!-- gallery rail + balusters -->
    <rect x="46.2" y="31.4" width="27.6" height="1.2" rx=".4"/>
    <rect x="46.45" y="32.6" width=".9" height="4"/><rect x="48.85" y="32.6" width=".9" height="4"/>
    <rect x="51.25" y="32.6" width=".9" height="4"/><rect x="53.65" y="32.6" width=".9" height="4"/>
    <rect x="56.05" y="32.6" width=".9" height="4"/><rect x="58.45" y="32.6" width=".9" height="4"/>
    <rect x="60.85" y="32.6" width=".9" height="4"/><rect x="63.25" y="32.6" width=".9" height="4"/>
    <rect x="65.65" y="32.6" width=".9" height="4"/><rect x="68.05" y="32.6" width=".9" height="4"/>
    <rect x="70.45" y="32.6" width=".9" height="4"/><rect x="72.85" y="32.6" width=".9" height="4"/>
    <!-- deck + corbel -->
    <rect x="45.2" y="36.6" width="29.6" height="2.4" rx=".4"/>
    <path d="M47.8 39 L72.2 39 L68.2 43.6 L51.8 43.6 Z"/>
    <!-- tower -->
    <path d="M53.2 44.8 L66.8 44.8 L74.4 92 L45.6 92 Z"/>
  </g>
  <!-- lit glazing -->
  <g fill="#c9a227">
    <rect x="55" y="25.8" width="3.2" height="5.4"/>
    <rect x="59.2" y="25.8" width="3.2" height="5.4"/>
  </g>
  <!-- corbel brackets (negative space) -->
  <g stroke="#ffffff" stroke-width=".8" stroke-linecap="round">
    <line x1="53.8" y1="39.8" x2="54.8" y2="42.8"/><line x1="58.2" y1="39.8" x2="58.5" y2="42.8"/>
    <line x1="61.8" y1="39.8" x2="61.5" y2="42.8"/><line x1="66.2" y1="39.8" x2="65.2" y2="42.8"/>
  </g>
  <!-- sunlit left face, inset 1.6u -->
  <path d="M54.6 46.4 L60 46.4 L60 90.4 L47.5 90.4 Z" fill="#ffffff"/>
  <!-- staircase windows, staggered -->
  <rect x="56.2" y="51.6" width="2.2" height="4.6" rx="1.1" fill="#1d3557"/>
  <rect x="62.4" y="57.8" width="2.2" height="4.6" rx="1.1" fill="#ffffff"/>
  <rect x="55.2" y="63.6" width="2.4" height="4.8" rx="1.2" fill="#1d3557"/>
  <rect x="63.6" y="79.4" width="2.4" height="4.8" rx="1.2" fill="#ffffff"/>
  <!-- day-mark band, floated on 1.2u gaps -->
  <rect x="40" y="70.8" width="40" height="5.8" fill="#ffffff"/>
  <rect x="47.4" y="72" width="25.2" height="3.4" rx=".4" fill="#1d3557"/>
  <!-- arched door -->
  <path d="M57.4 92 L57.4 87.6 Q57.4 84.8 60 84.8 Q62.6 84.8 62.6 87.6 L62.6 92 Z" fill="#ffffff" stroke="#1d3557" stroke-width="1.2"/>
  <!-- headland -->
  <path d="M14 98.2 C18.6 94.2 23.4 92.6 27.8 93.4 C31 88.8 36.6 87.4 40.6 89.8 C43.6 88.6 46.6 89.6 48 92 L72 92 C73.4 89.6 76.4 88.6 79.4 89.8 C83.4 87.4 89 88.8 92.2 93.4 C96.6 92.6 101.4 94.2 106 98.2 Z" fill="#1d3557"/>
  <g stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M35.4 90.6 L38 93.6 L37.4 96.4"/><path d="M24.6 96.8 L28.4 95.2"/><path d="M43.4 92.4 L44.6 95"/>
    <path d="M84.6 90.6 L82 93.6 L82.6 96.4"/><path d="M95.4 96.8 L91.6 95.2"/><path d="M76.6 92.4 L75.4 95"/>
  </g>
  <!-- horizon on a 1.2u gap, receding water, brass reflection -->
  <rect x="8" y="99.4" width="104" height="1.6" rx=".8" fill="#1d3557"/>
  <g stroke-linecap="round" stroke-width="1.2">
    <line x1="28" y1="105" x2="54" y2="105" stroke="#1d3557"/>
    <line x1="57" y1="105" x2="63" y2="105" stroke="#c9a227"/>
    <line x1="66" y1="105" x2="92" y2="105" stroke="#1d3557"/>
    <line x1="42" y1="109.6" x2="78" y2="109.6" stroke="#1d3557"/>
    <line x1="53" y1="114.2" x2="67" y2="114.2" stroke="#1d3557"/>
  </g>
</svg>
