<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Studio 2918 lighthouse">
  <g fill="#1d3557">
    <!-- finial + dome -->
    <circle cx="60" cy="11.2" r="1.3"/>
    <rect x="59.4" y="12" width="1.2" height="5"/>
    <path d="M53 26 Q53 17 60 17 Q67 17 67 26 Z"/>
    <rect x="52" y="25.4" width="16" height="1.8"/>
  </g>
  <!-- lantern: left pane open, right pane solid -->
  <rect x="54.2" y="27.2" width="11.6" height="8" fill="#ffffff" stroke="#1d3557" stroke-width="1.4"/>
  <rect x="60" y="27.2" width="5.8" height="8" fill="#1d3557"/>
  <path d="M56.4 35.2 L56.4 31 Q56.4 29.2 58 29.2 L58 35.2 Z" fill="#1d3557"/>
  <!-- gallery railing -->
  <g stroke="#1d3557" stroke-linecap="round">
    <line x1="49.5" y1="33" x2="70.5" y2="33" stroke-width="1.2"/>
    <g stroke-width=".9">
      <line x1="50.2" y1="33" x2="50.2" y2="37.6"/><line x1="52.6" y1="33" x2="52.6" y2="37.6"/>
      <line x1="67.4" y1="33" x2="67.4" y2="37.6"/><line x1="69.8" y1="33" x2="69.8" y2="37.6"/>
    </g>
  </g>
  <g fill="#1d3557">
    <!-- deck + corbel -->
    <rect x="48.5" y="37.4" width="23" height="2.6"/>
    <path d="M51 40 L69 40 L66.8 44 L53.2 44 Z"/>
  </g>
  <!-- tower: left half light, right half solid -->
  <path d="M53.4 44 L60 44 L60 96 L49 96 Z" fill="#ffffff" stroke="#1d3557" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M60 44 L66.6 44 L71 96 L60 96 Z" fill="#1d3557"/>
  <!-- windows -->
  <rect x="56" y="51" width="2.4" height="5.4" rx="1.2" fill="#1d3557"/>
  <rect x="61.8" y="58" width="2.4" height="5.4" rx="1.2" fill="#ffffff"/>
  <rect x="55.4" y="78" width="2.4" height="5.4" rx="1.2" fill="#1d3557"/>
  <!-- band -->
  <rect x="49.2" y="69.6" width="21.6" height="3.4" fill="#1d3557"/>
  <!-- rocky base + horizon -->
  <path d="M22 100 C27 94 33 92.5 39 94.2 C42 92.8 45 93.4 47 95.5 L73 95.5 C76 92 81 91.2 85 93.6 C89 92.6 94 95 98 100 Z" fill="#1d3557"/>
  <line x1="16" y1="100" x2="104" y2="100" stroke="#1d3557" stroke-width="1.6" stroke-linecap="round"/>
</svg>
