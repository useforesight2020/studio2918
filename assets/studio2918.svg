<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Studio 2918 lighthouse">
  <g fill="none" stroke="#1d3557" stroke-linecap="square" stroke-linejoin="miter">
    <!-- emblem ring -->
    <circle cx="60" cy="60" r="55" stroke-width="2"/>
    <circle cx="60" cy="60" r="50.5" stroke-width=".8"/>
  </g>
  <!-- light rays -->
  <g stroke="#c9a227" stroke-width="1.3" stroke-linecap="round">
    <line x1="68" y1="33" x2="98" y2="26"/>
    <line x1="68" y1="35" x2="98" y2="42"/>
    <line x1="52" y1="33" x2="22" y2="26"/>
    <line x1="52" y1="35" x2="22" y2="42"/>
  </g>
  <!-- finial + cap -->
  <line x1="60" y1="15" x2="60" y2="20" stroke="#1d3557" stroke-width="1.6"/>
  <path d="M51 27 L60 20 L69 27 Z" fill="#1d3557"/>
  <!-- lantern room -->
  <rect x="54" y="27" width="12" height="11" fill="none" stroke="#1d3557" stroke-width="1.6"/>
  <line x1="60" y1="27" x2="60" y2="38" stroke="#1d3557" stroke-width="1.2"/>
  <!-- gallery -->
  <rect x="50" y="38" width="20" height="3" fill="#1d3557"/>
  <!-- tower: left half solid, right half outlined -->
  <path d="M53.5 41 L60 41 L60 90 L47 90 Z" fill="#1d3557"/>
  <path d="M60 41 L66.5 41 L73 90 L60 90" fill="none" stroke="#1d3557" stroke-width="1.6"/>
  <g stroke="#1d3557" stroke-width="1">
    <line x1="60" y1="57" x2="68.6" y2="57"/>
    <line x1="60" y1="73" x2="70.8" y2="73"/>
  </g>
  <!-- horizon + water -->
  <line x1="28" y1="90" x2="92" y2="90" stroke="#1d3557" stroke-width="2"/>
  <line x1="38" y1="96" x2="82" y2="96" stroke="#1d3557" stroke-width="1.2"/>
  <line x1="47" y1="101.5" x2="73" y2="101.5" stroke="#1d3557" stroke-width="1.2"/>
</svg>
