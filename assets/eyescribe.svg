<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="EyeScribe">
<!-- EyeScribe mark: a fountain-pen nib split down its slit. Left = what the doctor does (solid);
     right = its mirror (outline), every cut detail on the left drawn back in ink on the right. -->
<style>
  .tile{fill:#ffffff;stroke:#e7e3da}.ink{fill:#1b1d1c}.line{stroke:#1b1d1c}
  @media (prefers-color-scheme: dark){.tile{fill:#181c1b;stroke:#2a2f2d}.ink{fill:#ecedeb}.line{stroke:#ecedeb}}
</style>
<defs><mask id="escut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
  <rect width="100" height="100" fill="#fff"/>
  <g fill="#000">
    <!-- mirror half: hollow panels inset 1.6 -->
    <rect x="50.55" y="15.6" width="12.85" height="5.8"/>
    <path d="M50.55 25.8 L63.5 25.8 C68.8 32 68.8 42 63.9 51.3 C59.6 59.4 54.4 66.8 50.55 74.6 Z"/>
    <!-- collar gap + grooves -->
    <rect x="30" y="23" width="40" height="1.4"/>
    <rect x="30" y="17.2" width="20.55" height=".7"/><rect x="30" y="19.6" width="20.55" height=".7"/>
    <!-- breather hole -->
    <circle cx="50" cy="40" r="3.6"/>
    <!-- slit -->
    <rect x="49.45" y="46.4" width="1.1" height="33"/>
  </g>
  <!-- engraving, cut into the solid half -->
  <g fill="none" stroke="#000" stroke-width=".8" stroke-linecap="round">
    <path d="M37.4 26.6 C34 32 34 41 37.8 49"/>
    <path d="M40.6 53 C43.6 58.6 46 63.4 48 68"/>
  </g>
</mask></defs>
<rect class="tile" x=".75" y=".75" width="98.5" height="98.5" rx="22" stroke-width="1.5"/>
<g transform="translate(-6 4) rotate(35 50 46)">
<g class="ink">
  <path mask="url(#escut)" d="M35 14 L65 14 L65 23 C70.6 30 70.6 42 65.4 52 C60.8 60.6 55 68.4 50 78 C45 68.4 39.2 60.6 34.6 52 C29.4 42 29.4 30 35 23 Z"/>
  <circle cx="50" cy="40" r="1.2"/>
  <!-- mirrored collar grooves -->
  <rect x="50.55" y="17.2" width="12.85" height=".7"/><rect x="50.55" y="19.6" width="12.85" height=".7"/>
</g>
<!-- mirrored breather and engraving, drawn in ink -->
<g class="line" fill="none" stroke-linecap="round">
  <path d="M50 36.4 A3.6 3.6 0 0 1 50 43.6" stroke-width="1.1"/>
  <path d="M62.6 26.6 C66 32 66 41 62.2 49" stroke-width=".8"/>
  <path d="M59.4 53 C56.4 58.6 54 63.4 52 68" stroke-width=".8"/>
</g>
</g>
<!-- ink stroke it writes -->
<path class="ink" d="M26.2 75.6 C42 77.2 60 78 80 78.4 C60 79.6 42 79.2 26.2 75.6 Z"/>
</svg>
