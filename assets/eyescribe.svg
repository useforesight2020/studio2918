<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="EyeScribe">
<!-- EyeScribe mark: two identical rings (you + the copy). Where they overlap, an eye/lens appears.
     Rings weave over/under; the lens floats on a 1.2u gap like the lighthouse's band. -->
<style>
  .tile{fill:#ffffff;stroke:#e7e3da}.ink{fill:#1b1d1c}.line{stroke:#1b1d1c}.gap{stroke:#ffffff}
  @media (prefers-color-scheme: dark){.tile{fill:#181c1b;stroke:#2a2f2d}.ink{fill:#ecedeb}.line{stroke:#ecedeb}.gap{stroke:#181c1b}}
</style>
<rect class="tile" x=".75" y=".75" width="98.5" height="98.5" rx="22" stroke-width="1.5"/>
<g fill="none" stroke-width="2.4">
  <circle class="line" cx="39" cy="50" r="22"/>
  <circle class="line" cx="61" cy="50" r="22"/>
  <!-- weave: left ring over at the top, right ring over at the bottom -->
  <path class="gap" stroke-width="5.2" d="M46.52 29.33 A22 22 0 0 1 53.14 33.15"/>
  <path class="line" d="M45.8 29.2 A22 22 0 0 1 53.9 33.8"/>
  <path class="gap" stroke-width="5.2" d="M53.48 70.67 A22 22 0 0 1 46.86 66.85"/>
  <path class="line" d="M54.2 70.8 A22 22 0 0 1 46.1 66.2"/>
</g>
<!-- lens with pupil -->
<path class="ink" fill-rule="evenodd" d="M50 33.78 A19.6 19.6 0 0 1 50 66.22 A19.6 19.6 0 0 1 50 33.78 Z M50 45.6 A4.4 4.4 0 1 0 50.01 45.6 Z"/>
<circle class="ink" cx="51.5" cy="48.5" r="1.1"/>
</svg>
