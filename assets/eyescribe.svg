<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="EyeScribe">
<!-- EyeScribe mark: a click and its mirror. Right pointer = what you do (solid);
     left pointer = EyeScribe mimicking it (outline), reflected across a dashed mirror line. -->
<style>
  .tile{fill:#ffffff;stroke:#e7e3da}.ink{fill:#1b1d1c}.line{stroke:#1b1d1c}
  @media (prefers-color-scheme: dark){.tile{fill:#181c1b;stroke:#2a2f2d}.ink{fill:#ecedeb}.line{stroke:#ecedeb}}
</style>
<rect class="tile" x=".75" y=".75" width="98.5" height="98.5" rx="22" stroke-width="1.5"/>
<!-- you: solid pointer -->
<path class="ink" d="M53 30 L53 72.5 L63 62.5 L70 77.5 L76.75 74.5 L69.75 60 L83.75 60 Z"/>
<!-- the mirror: same pointer, reflected, in outline -->
<path class="line" fill="none" stroke-width="2" stroke-linejoin="round" d="M47 30 L47 72.5 L37 62.5 L30 77.5 L23.25 74.5 L30.25 60 L16.25 60 Z"/>
<g class="line" fill="none" stroke-linecap="round">
  <!-- mirror line -->
  <line x1="50" y1="14" x2="50" y2="86" stroke-width=".9" stroke-dasharray="2.6 2.2"/>
  <!-- click ticks, mirrored -->
  <g stroke-width="1.8">
    <line x1="54" y1="24.6" x2="54" y2="19.2"/><line x1="57.6" y1="26.2" x2="61.4" y2="22.4"/><line x1="59.2" y1="30" x2="64.6" y2="30"/>
    <line x1="46" y1="24.6" x2="46" y2="19.2"/><line x1="42.4" y1="26.2" x2="38.6" y2="22.4"/><line x1="40.8" y1="30" x2="35.4" y2="30"/>
  </g>
</g>
</svg>
