<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="EyeScribe">
<style>
  .tile{fill:#ffffff;stroke:#e7e3da}.ink{fill:#1b1d1c}
  @media (prefers-color-scheme: dark){.tile{fill:#181c1b;stroke:#2a2f2d}.ink{fill:#ecedeb}}
</style>
<rect class="tile" x=".75" y=".75" width="98.5" height="98.5" rx="22" stroke-width="1.5"/>
<g class="ink" fill-rule="evenodd">
  <!-- eye outline -->
  <path d="M16 46 C29 26 71 26 84 46 C71 66 29 66 16 46 Z M22.4 46 C33.6 31.4 66.4 31.4 77.6 46 C66.4 60.6 33.6 60.6 22.4 46 Z"/>
  <!-- iris ring with pupil, floated on a gap -->
  <path d="M50 36 A10 10 0 1 1 49.99 36 Z M50 41.4 A4.6 4.6 0 1 0 50.01 41.4 Z"/>
  <circle cx="52.2" cy="44" r="1.5"/>
  <!-- note lines, receding like the lighthouse's water -->
  <rect x="27" y="70" width="46" height="2.4" rx="1.2"/>
  <rect x="35" y="76.6" width="30" height="2.4" rx="1.2"/>
  <rect x="43" y="83.2" width="14" height="2.4" rx="1.2"/>
</g>
</svg>
